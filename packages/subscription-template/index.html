<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Workspace · Subscription template</title>
  </head>
  <body>
    <header><strong>Workspace</strong><span>Subscription template</span></header>
    <main>
      <p role="alert" id="error"></p>
      <p role="status" id="status" aria-live="polite"></p>
      <section id="auth">
        <h1>A place for your team.</h1>
        <p>Start a workspace, invite your team, and manage your subscription.</p>
        <form id="account-form">
          <label>Name<input id="name" autocomplete="name" /></label
          ><label>Email<input id="email" type="email" autocomplete="email" required /></label
          ><label
            >Password<input
              id="password"
              type="password"
              autocomplete="current-password"
              minlength="12"
              required /></label
          ><button type="submit">Sign in</button
          ><button type="button" id="signup">Create account</button>
        </form>
        <div id="providers"></div>
      </section>
      <section id="app" hidden>
        <section id="invitation" hidden>
          <h2>Workspace invitation</h2>
          <button id="accept-invitation">Accept invitation</button>
        </section>
        <div class="row">
          <h1 id="greeting"></h1>
          <button id="logout">Sign out</button>
        </div>
        <label>Workspace<select id="workspace"></select></label>
        <form id="workspace-form">
          <label>Workspace name<input id="workspace-name" required maxlength="100" /></label
          ><button>Create workspace</button>
        </form>
        <section id="workspace-detail" hidden>
          <h2 id="workspace-title"></h2>
          <p id="role"></p>
          <div id="team"></div>
          <div id="billing"></div>
        </section>
        <section id="security">
          <h2>Account security</h2>
          <p id="security-status"></p>
        </section>
      </section>
    </main>
    <script type="module" src="/src/client.ts"></script>
  </body>
</html>
