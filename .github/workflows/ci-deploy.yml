name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect Markdown-only changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      markdown-only: ${{ steps.diff.outputs.markdown-only }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Include both sides of renames so moving code to a .md file runs tests.
          changes="$(git diff --name-only --no-renames "$BASE...$HEAD" -- . ':(exclude)*.md')"
          markdown_only=false
          if [[ -z "$changes" ]]; then markdown_only=true; fi
          echo "markdown-only=$markdown_only" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: herbie-verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.34.6
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check lint, formatting, build, and types
        run: bash scripts/ci-verify.sh build
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci
          retention-days: 7

  unit-verification:
    name: Unit and PostgreSQL integration tests
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.markdown-only == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: herbie-unit-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: herbie
          POSTGRES_PASSWORD: herbie-local-only
          POSTGRES_DB: herbie
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U herbie"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      HERBIE_TEST_DATABASE_URL: postgresql://herbie:herbie-local-only@127.0.0.1:55432/herbie
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.34.6
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run all unit and database integration tests
        run: bash scripts/ci-verify.sh unit
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci
          retention-days: 7

  cli-verification:
    name: Compiled CLI end-to-end
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.markdown-only == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: herbie-cli-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: herbie
          POSTGRES_PASSWORD: herbie-local-only
          POSTGRES_DB: herbie
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U herbie"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      HERBIE_TEST_DATABASE_URL: postgresql://herbie:herbie-local-only@127.0.0.1:55432/herbie
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.34.6
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build and run the CLI against local demo service
        run: bash scripts/ci-verify.sh cli
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci
          retention-days: 7

  browser-verification:
    name: Browser verification
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.markdown-only == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: herbie-browser-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: herbie
          POSTGRES_PASSWORD: herbie-local-only
          POSTGRES_DB: herbie
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U herbie"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      HERBIE_TEST_DATABASE_URL: postgresql://herbie:herbie-local-only@127.0.0.1:55432/herbie
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.34.6
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build and run browser scenarios
        run: bash scripts/ci-verify.sh browser
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci
            packages/web/test-results
          retention-days: 7

  container-verification:
    name: Portable container verification
    # Every PR needs a tested image for promotion after merge, including docs-only PRs.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/portable-smoke.yml
    with:
      publish: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.HERBIE_IMAGE_PUBLISH_ENABLED == 'true' }}

  all-tests-passed:
    name: All tests passed
    needs:
      - changes
      - verify
      - unit-verification
      - cli-verification
      - browser-verification
      - container-verification
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every blocking check to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MARKDOWN_ONLY: ${{ needs.changes.outputs.markdown-only }}
          BUILD_RESULT: ${{ needs.verify.result }}
          UNIT_RESULT: ${{ needs.unit-verification.result }}
          CLI_RESULT: ${{ needs.cli-verification.result }}
          BROWSER_RESULT: ${{ needs.browser-verification.result }}
          CONTAINER_RESULT: ${{ needs.container-verification.result }}
        run: |
          failed=0
          for check in CHANGES BUILD UNIT CLI BROWSER CONTAINER; do
            result_var="${check}_RESULT"
            result="${!result_var}"
            if [[ "$MARKDOWN_ONLY" == true && "$result" == skipped && "$check" =~ ^(UNIT|CLI|BROWSER)$ ]]; then
              continue
            fi
            if [[ "$result" != success ]]; then
              printf '%s verification result: %s\n' "$check" "$result" >&2
              failed=1
            fi
          done
          exit "$failed"

  publish-portable-image:
    name: Promote PR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/portable-image.yml
    with:
      publish: true
      release_sequence: ${{ github.run_number }}
