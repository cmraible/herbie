name: CLI proof of concept
on:
  pull_request:
    paths: ['packages/loop/**', 'pnpm-lock.yaml', 'package.json', 'tsconfig.json', '.github/workflows/loop.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @herbie/loop typecheck
      - run: pnpm --filter @herbie/loop test
      - run: pnpm --filter @herbie/loop build
