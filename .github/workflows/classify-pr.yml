name: Classify PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to classify (including historical PRs)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: classify-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Execute only trusted base code. PR contents are fetched as data via the API.
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24.19.0"
      - name: Grade PR quality and classify change type, risk, and subsystems
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          APPLY_LABELS: ${{ github.event_name == 'pull_request_target' }}
        run: node scripts/classify-pr.mjs
      - name: Save classification for evaluation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-classification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/pr-classification.json
          if-no-files-found: ignore
          retention-days: 30
