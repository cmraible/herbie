name: Portable image
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified main image to the configured registry
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    name: Portable container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Build and exercise the standalone container with an isolated database
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build --build-arg HERBIE_RUNTIME_REVISION="$REVISION" -t herbie:smoke .
          bash scripts/test-portable-container.sh herbie:smoke "$REVISION"
  publish:
    name: Publish configured image
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      github.ref == 'refs/heads/main' && vars.HERBIE_IMAGE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: homelab-image
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: herbie-image-publish
      cancel-in-progress: false
    env:
      IMAGE_REPOSITORY: ${{ secrets.HERBIE_IMAGE_REPOSITORY }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Validate registry configuration
        env:
          WIF_PROVIDER: ${{ secrets.HERBIE_GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.HERBIE_GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$WIF_PROVIDER" && test -n "$SERVICE_ACCOUNT"
          [[ "$IMAGE_REPOSITORY" =~ ^[a-z0-9-]+-docker\.pkg\.dev/[a-z0-9-]+/[a-z0-9_-]+/[a-z0-9_-]+$ ]]
      - name: Build and verify the exact image before obtaining registry credentials
        run: |
          docker build --platform linux/amd64 --build-arg HERBIE_RUNTIME_REVISION="$REVISION" -t herbie:publish .
          bash scripts/test-portable-container.sh herbie:publish "$REVISION"
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.HERBIE_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.HERBIE_GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Push immutable revision tag and record digest
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          registry="${IMAGE_REPOSITORY%%/*}"
          trap 'docker logout "$registry" >/dev/null 2>&1 || true' EXIT
          printf '%s' "$ACCESS_TOKEN" | docker login --username oauth2accesstoken --password-stdin "$registry"
          docker tag herbie:publish "$IMAGE_REPOSITORY:$REVISION"
          docker push "$IMAGE_REPOSITORY:$REVISION"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REPOSITORY:$REVISION")"
          printf 'Revision: `%s`\n\nDigest: `%s`\n' "$REVISION" "${digest##*@}" >> "$GITHUB_STEP_SUMMARY"
