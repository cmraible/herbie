name: Portable image
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      release_sequence:
        description: Monotonic sequence from the main CI run
        type: string
        default: "0"
  workflow_dispatch:
    inputs:
      publish:
        description: Promote the matching PR image to the main revision tag
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    if: ${{ !inputs.publish }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/portable-smoke.yml
  publish:
    name: Promote GHCR image
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && inputs.publish &&
      github.ref == 'refs/heads/main' && vars.HERBIE_IMAGE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: homelab-image
    permissions:
      contents: read
      packages: write
    concurrency:
      group: herbie-image-publish
      cancel-in-progress: false
    env:
      REPOSITORY: ${{ github.repository }}
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      REVISION: ${{ github.sha }}
      RELEASE_SEQUENCE: ${{ inputs.release_sequence || '0' }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install checksum-pinned Flux artifact publisher
        if: inputs.release_sequence != '' && inputs.release_sequence != '0'
        run: |
          curl --fail --silent --show-error --location https://github.com/fluxcd/flux2/releases/download/v2.9.6/flux_2.9.6_linux_amd64.tar.gz -o "$RUNNER_TEMP/flux.tar.gz"
          echo "b4d22673e9246cbd628881f1a9ef3b090085dced291e42d804555cee8e8d42c5  $RUNNER_TEMP/flux.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/flux-bin"
          tar -xzf "$RUNNER_TEMP/flux.tar.gz" -C "$RUNNER_TEMP/flux-bin" flux
          echo "$RUNNER_TEMP/flux-bin" >> "$GITHUB_PATH"
      - name: Reject a superseded main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$current" = "$REVISION" || { echo 'Main advanced; this image must not be published.' >&2; exit 1; }
      - name: Promote the existing manifest and announce the release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE_REPOSITORY="ghcr.io/${REPOSITORY,,}"
          registry=ghcr.io
          trap 'docker logout "$registry" >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login --username "$GHCR_ACTOR" --password-stdin "$registry"
          export HERBIE_BUILD_CACHE="$IMAGE_REPOSITORY:buildcache-linux-amd64"
          tree="$(git rev-parse HEAD^{tree})"
          digest="$(bash scripts/promote-portable-image.sh "$IMAGE_REPOSITORY" "$tree" "$REVISION" "$RELEASE_SEQUENCE")"
          if [[ "$RELEASE_SEQUENCE" =~ ^[1-9][0-9]*$ ]]; then
            node scripts/build-release-artifact.mjs "$digest" "$REVISION" "$RUNNER_TEMP/release-artifact"
            # Recheck after promotion, immediately before announcing a release.
            current="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            test "$current" = "$REVISION" || { echo 'Main advanced; refusing release artifact.' >&2; exit 1; }
            flux push artifact "oci://$IMAGE_REPOSITORY:0.0.$RELEASE_SEQUENCE" \
              --path="$RUNNER_TEMP/release-artifact" --source="$REPOSITORY_URL" \
              --revision="main@sha1:$REVISION"
            printf '\nFlux release artifact: `%s:0.0.%s`\n' "$IMAGE_REPOSITORY" "$RELEASE_SEQUENCE" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'Revision: `%s`\n\nImmutable image: `%s`\n' "$REVISION" "$digest" >> "$GITHUB_STEP_SUMMARY"
