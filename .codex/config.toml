[mcp_servers.elasticsearch]
command = "node"
args = ["scripts/elasticsearch-mcp.mjs"]
env_vars = [
  "ES_URL",
  "ES_API_KEY",
  "HTTP_PROXY",
  "HTTPS_PROXY",
  "NO_PROXY",
  "http_proxy",
  "https_proxy",
  "no_proxy",
  "NODE_EXTRA_CA_CERTS",
  "CODEX_PROXY_CERT",
  "XDG_CACHE_HOME",
]
startup_timeout_sec = 300
